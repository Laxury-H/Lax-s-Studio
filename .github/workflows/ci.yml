name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.14.1'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint and Build
      run: npm run build
